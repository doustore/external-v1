name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Descomprimir y Compilar
        run: |
          unzip -o *.zip -d proyecto
          # Entramos a la subcarpeta donde está el proyecto Xcode extraído
          cd proyecto/ourstyle
          
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme "3105" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" BUILD_DIR="$PWD/build"
          
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r ThreeOneOSFive.ipa Payload
          
          # Movemos el IPA resultante a una ruta accesible para el artifact
          mkdir -p ../../output
          mv ThreeOneOSFive.ipa ../../output/

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: output/ThreeOneOSFive.ipa
